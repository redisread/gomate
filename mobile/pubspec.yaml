name: gomate
description: GoMate - 地点组队平台
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  share_plus: ^10.0.2
  photo_view: ^0.15.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  gal: ^2.3.2
  clipboard: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
