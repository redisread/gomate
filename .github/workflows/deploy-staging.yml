name: Deploy Staging
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: Deploy API to Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @gomate/api lint
      - name: Unit & Integration Tests
        run: pnpm --filter @gomate/api test
      - name: Apply D1 migrations
        run: pnpm --filter @gomate/api exec wrangler d1 migrations apply gomate-db-staging --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set API secrets
        run: |
          pnpm --filter @gomate/api exec wrangler secret put BETTER_AUTH_SECRET --env staging --name BETTER_AUTH_SECRET <<< "${{ secrets.BETTER_AUTH_SECRET }}"
          pnpm --filter @gomate/api exec wrangler secret put RESEND_API_KEY --env staging --name RESEND_API_KEY <<< "${{ secrets.RESEND_API_KEY }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy API Worker to Staging
        run: pnpm --filter @gomate/api exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  frontend:
    name: Deploy Frontend to Staging
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: Generate i18n locales
        run: pnpm i18n:build
      - name: Type Check
        run: pnpm --filter @gomate/frontend type-check
      - name: i18n Key Validation
        run: pnpm --filter @gomate/frontend i18n:validate
      - name: Tests
        run: pnpm --filter @gomate/frontend test
      - name: Build
        run: pnpm --filter @gomate/frontend build
        env:
          PUBLIC_API_URL: https://api-staging.gomate.live
          CLOUDFLARE_ENV: staging
      - name: Deploy Frontend Worker to Staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy --env staging
