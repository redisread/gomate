name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  # ============================================
  # 1. 部署后端 API 到 Cloudflare Workers
  # ============================================
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy API to Cloudflare Workers
        run: pnpm --filter @gomate/api deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ============================================
  # 2. 部署前端到 Cloudflare Pages
  # ============================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-api  # 等待 API 部署完成后再部署前端
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @gomate/frontend build
        env:
          PUBLIC_API_URL: https://api.gomate.live

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gomate-frontend
          directory: frontend/dist

  # ============================================
  # 3. 通知部署结果 (可选)
  # ============================================
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-frontend]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "========================================"
          echo "🚀 部署完成!"
          echo "========================================"
          echo "API 部署状态: ${{ needs.deploy-api.result }}"
          echo "前端部署状态: ${{ needs.deploy-frontend.result }}"
          echo "========================================"
          echo "生产环境地址:"
          echo "  - API: https://api.gomate.live"
          echo "  - 前端: https://gomate.live"
          echo "========================================"
