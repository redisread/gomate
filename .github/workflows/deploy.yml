name: Release unified Worker to production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_PRODUCTION to release the current main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gomate-production-mutation
  cancel-in-progress: false

jobs:
  release:
    name: Approve, stage, and release production version
    if: inputs.confirm == 'DEPLOY_PRODUCTION' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      CLOUDFLARE_ENV: production
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate source and unified Worker
        run: |
          pnpm audit --prod --audit-level high
          pnpm check:legacy-removal
          pnpm test:delivery
          pnpm i18n:build
          pnpm --filter @gomate/api check:migrations
          pnpm --filter @gomate/api lint
          pnpm --filter @gomate/api type-check
          pnpm --filter @gomate/api build
          pnpm --filter @gomate/api test
          pnpm --filter @gomate/frontend worker:types:check
          pnpm --filter @gomate/frontend i18n:validate
          pnpm --filter @gomate/frontend lint
          pnpm --filter @gomate/frontend type-check
          pnpm --filter @gomate/frontend test
          pnpm --filter @gomate/frontend build
          pnpm --filter @gomate/frontend worker:dry-run
          pnpm --filter @gomate/frontend worker:size
          pnpm --filter @gomate/frontend worker:startup

      - name: Validate live production configuration
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node scripts/validate-production-release.mjs
          EXPECTED_DOMAIN_SERVICE=gomate-production-preview node scripts/production-domain.mjs assert

      - name: Capture current production version
        working-directory: frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENTS_FILE: ${{ runner.temp }}/gomate-deployments.json
        run: >-
          pnpm exec wrangler deployments list --env production --json
          --config wrangler.jsonc > "$DEPLOYMENTS_FILE"

      - name: Validate current production version
        id: current_version
        env:
          DEPLOYMENTS_FILE: ${{ runner.temp }}/gomate-deployments.json
        run: node scripts/release-versions.mjs active "$DEPLOYMENTS_FILE"

      - name: Create private production secrets file
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECRETS_FILE: ${{ runner.temp }}/gomate-production-secrets.json
        run: node scripts/write-production-secrets.mjs

      - name: Upload immutable Worker version
        id: upload
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_ENV: production
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          packageManager: pnpm
          wranglerVersion: "4.100.0"
          command: >-
            versions upload
            --tag sha-${{ github.sha }}
            --message "GitHub release candidate ${{ github.run_id }}"
            --secrets-file ${{ runner.temp }}/gomate-production-secrets.json

      - name: Remove ephemeral production secrets
        if: always()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          SECRETS_FILE: ${{ runner.temp }}/gomate-production-secrets.json
        run: node scripts/remove-deployment-secrets.mjs

      - name: Read uploaded version ID
        id: upload_result
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: node scripts/release-versions.mjs upload

      - name: Stage candidate at zero percent
        id: stage
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          packageManager: pnpm
          wranglerVersion: "4.100.0"
          command: >-
            versions deploy
            ${{ steps.current_version.outputs.version_id }}@100%
            ${{ steps.upload_result.outputs.version_id }}@0%
            --env production
            --message "Stage candidate ${{ github.sha }} at 0%"
            -y

      - name: Smoke candidate through Version Override
        id: candidate_smoke
        env:
          EXPECTED_VERSION_ID: ${{ steps.upload_result.outputs.version_id }}
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          USE_VERSION_OVERRIDE: "true"
        run: node scripts/smoke-production-version.mjs

      - name: Revalidate production domain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_DOMAIN_SERVICE: gomate-production-preview
        run: node scripts/production-domain.mjs assert

      - name: Promote candidate to all traffic
        id: promote
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          packageManager: pnpm
          wranglerVersion: "4.100.0"
          command: >-
            versions deploy
            ${{ steps.upload_result.outputs.version_id }}@100%
            --env production
            --message "Production release ${{ github.sha }}"
            -y

      - name: Smoke promoted production version
        id: production_smoke
        env:
          EXPECTED_VERSION_ID: ${{ steps.upload_result.outputs.version_id }}
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
        run: node scripts/smoke-production-version.mjs

      - name: Observe the promoted version
        env:
          EXPECTED_VERSION_ID: ${{ steps.upload_result.outputs.version_id }}
          OBSERVATION_DURATION_MS: "300000"
          OBSERVATION_INTERVAL_MS: "30000"
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
        run: node scripts/observe-production.mjs

      - name: Restore previous version after production validation failure
        if: (failure() || cancelled()) && steps.current_version.outcome == 'success' && steps.stage.outcome != 'skipped'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          packageManager: pnpm
          wranglerVersion: "4.100.0"
          command: >-
            versions deploy
            ${{ steps.current_version.outputs.version_id }}@100%
            --env production
            --message "Automatic rollback for failed validation ${{ github.run_id }}"
            -y

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gomate-deployments.json
            ${{ runner.temp }}/wrangler-upload.ndjson
          retention-days: 90

      - name: Record release evidence
        if: success()
        env:
          CANDIDATE_VERSION_ID: ${{ steps.upload_result.outputs.version_id }}
          PREVIOUS_VERSION_ID: ${{ steps.current_version.outputs.version_id }}
          REQUEST_ID: ${{ steps.production_smoke.outputs.first_request_id }}
        run: |
          {
            echo "### Production Worker released"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${CANDIDATE_VERSION_ID}\`"
            echo "- Previous version: \`${PREVIOUS_VERSION_ID}\`"
            echo "- Smoke request: \`${REQUEST_ID}\`"
            echo "- Add this version to \`.github/production-version-allowlist.json\` in a reviewed PR before using it for rollback or a contract migration."
            echo "- D1 migrations are not part of Worker version rollback."
          } >> "$GITHUB_STEP_SUMMARY"
