name: Apply approved production D1 migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APPLY_PRODUCTION_MIGRATIONS after reviewing the exact pending files
        required: true
        type: string
      compatible_version_id:
        description: Exact live Worker UUID verified against both old and new schemas
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gomate-production-mutation
  cancel-in-progress: false

jobs:
  migrate:
    name: Approve and apply production D1 migrations
    if: inputs.confirm == 'APPLY_PRODUCTION_MIGRATIONS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ENV: production
      FORCE_COLOR: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate migration chain and API compatibility
        run: |
          pnpm check:legacy-removal
          pnpm test:delivery
          pnpm --filter @gomate/api check:migrations
          pnpm --filter @gomate/api lint
          pnpm --filter @gomate/api type-check
          pnpm --filter @gomate/api test

      - name: Verify production domain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_DOMAIN_SERVICE: gomate-production-preview
        run: node scripts/production-domain.mjs assert

      - name: Validate approved compatible Worker version
        id: approved_version
        env:
          WORKER_VERSION_ID: ${{ inputs.compatible_version_id }}
        run: node scripts/release-versions.mjs validate

      - name: Require exclusive production-version-allowlist schema boundary
        env:
          WORKER_VERSION_ID: ${{ steps.approved_version.outputs.version_id }}
        run: node scripts/release-versions.mjs exclusive

      - name: Capture current production version
        working-directory: frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENTS_FILE: ${{ runner.temp }}/gomate-deployments.json
        run: >-
          pnpm exec wrangler deployments list --env production --json
          --config wrangler.jsonc > "$DEPLOYMENTS_FILE"

      - name: Require the approved compatible version at 100 percent
        id: current_version
        env:
          DEPLOYMENTS_FILE: ${{ runner.temp }}/gomate-deployments.json
        run: node scripts/release-versions.mjs active "$DEPLOYMENTS_FILE"

      - name: Match migration approval to the live Worker
        env:
          APPROVED_VERSION_ID: ${{ steps.approved_version.outputs.version_id }}
          CURRENT_VERSION_ID: ${{ steps.current_version.outputs.version_id }}
        run: |
          if [ "$APPROVED_VERSION_ID" != "$CURRENT_VERSION_ID" ]; then
            echo "Approved compatible version is not serving 100% of production traffic" >&2
            exit 1
          fi

      - name: List pending migrations for protected-run evidence
        working-directory: frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler d1 migrations list DB --env production --remote
          --config wrangler.jsonc

      - name: Apply approved production migrations
        id: migrate
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          packageManager: pnpm
          wranglerVersion: "4.100.0"
          command: >-
            d1 migrations apply DB
            --env production
            --remote
            --config wrangler.jsonc

      - name: Verify no migrations remain pending
        working-directory: frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm exec wrangler d1 migrations list DB --env production --remote
          --config wrangler.jsonc

      - name: Record migration boundary
        run: |
          {
            echo "### Production D1 migrations applied"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Minimum schema-compatible Worker: \`${{ steps.current_version.outputs.version_id }}\`"
            echo "- Worker versions were not changed by this workflow."
            echo "- D1 migrations require an independent data recovery plan; Worker rollback does not undo them."
          } >> "$GITHUB_STEP_SUMMARY"
