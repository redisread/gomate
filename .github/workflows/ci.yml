name: Worker CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run-tests: ${{ steps.paths.outputs.run-tests }}
    steps:
      - name: Classify complete PR diff
        id: paths
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo,
              basehead: `${pr.base.sha}...${pr.head.sha}`,
              per_page: 1,
            });
            const files = data.files ?? [];
            // Unknown paths and incomplete API results always run the full suite.
            const isDocumentation = (path) =>
              /^(README|AGENTS|CLAUDE|CODING_STANDARDS|LESSONS|REVIEW)\.md$/.test(path) ||
              /^docs\/.+\.md$/.test(path);
            const docsOnly = files.length > 0 && files.length < 300 && files.length === pr.changed_files &&
              files.every((file) => isDocumentation(file.filename) &&
                (!file.previous_filename || isDocumentation(file.previous_filename)));
            core.setOutput('run-tests', !docsOnly);

  checks:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Check toolchain
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit --prod --audit-level high
        run: pnpm audit --prod --audit-level high

      - name: pnpm i18n:build
        run: pnpm i18n:build

      - name: pnpm i18n:validate
        run: pnpm i18n:validate

      - name: pnpm test:build-guard
        run: pnpm test:build-guard

      - name: pnpm db:check
        run: pnpm db:check

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm type-check
        run: pnpm type-check

      - name: pnpm check
        run: pnpm check

      - name: pnpm worker:types
        run: pnpm worker:types

  unit:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Check toolchain
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm i18n:build
        run: pnpm i18n:build

      - name: pnpm test
        run: pnpm test

      - name: pnpm test:server
        run: pnpm test:server

  database:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Check toolchain
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm test:db-reset
        run: pnpm test:db-reset

  worker:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Check toolchain
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm i18n:build
        run: pnpm i18n:build

      - name: pnpm build
        run: pnpm build

      - name: pnpm test:worker:run
        run: pnpm test:worker:run

      - name: pnpm worker:dry-run
        run: pnpm worker:dry-run

      - name: pnpm worker:size
        run: pnpm worker:size

  e2e:
    needs: changes
    if: needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      BETTER_AUTH_SECRET: local-ci-${{ github.run_id }}-${{ github.run_attempt }}-only-not-production
      RESEND_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Check toolchain
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm i18n:build
        run: pnpm i18n:build

      - name: pnpm db:reset
        run: pnpm db:reset
        env:
          GOMATE_LOCAL_STATE: ${{ runner.temp }}/gomate-e2e-${{ matrix.shard }}

      - name: pnpm test:e2e:ci --shard=${{ matrix.shard }}/6
        run: pnpm test:e2e:ci --shard=${{ matrix.shard }}/6
        env:
          GOMATE_LOCAL_STATE: ${{ runner.temp }}/gomate-e2e-${{ matrix.shard }}

      - name: Upload browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            e2e-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  validate:
    if: ${{ always() }}
    needs: [changes, checks, unit, database, worker, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every gate to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run-tests }}
          UNIT: ${{ needs.unit.result }}
          CHECKS: ${{ needs.checks.result }}
          DATABASE: ${{ needs.database.result }}
          WORKER: ${{ needs.worker.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          test "$CHANGES" = success
          case "$RUN_TESTS" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          for result in "$CHECKS" "$UNIT" "$DATABASE" "$WORKER" "$E2E"; do
            test "$result" = "$expected" || exit 1
          done
