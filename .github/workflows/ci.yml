name: Worker CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build locale data
        run: pnpm i18n:build

      - name: Run application gates
        run: pnpm test:ci

      - name: Generate Worker runtime types
        run: pnpm worker:types

      - name: Validate Wrangler bundle
        run: pnpm worker:dry-run

      - name: Enforce Worker size budget
        run: pnpm worker:size

      - name: Prepare isolated E2E database
        run: pnpm db:reset
        env:
          GOMATE_LOCAL_STATE: ${{ runner.temp }}/gomate-e2e-state

      - name: Run browser E2E
        run: pnpm test:e2e:ci
        env:
          BETTER_AUTH_SECRET: local-ci-${{ github.run_id }}-${{ github.run_attempt }}-only-not-production
          GOMATE_LOCAL_STATE: ${{ runner.temp }}/gomate-e2e-state
          RESEND_API_KEY: ""
