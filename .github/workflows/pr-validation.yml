name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # API Package Validation
  api-checks:
    name: API Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @gomate/api lint
      - name: Type Check
        run: pnpm --filter @gomate/api type-check
      - name: Build
        run: pnpm --filter @gomate/api build
      - name: Test
        run: pnpm --filter @gomate/api test

  # Frontend Package Validation
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Generate i18n locales
        run: pnpm i18n:build
      # Critical path: must pass for deployment
      - name: Type Check
        run: pnpm --filter @gomate/frontend type-check
      - name: i18n Key Validation
        run: pnpm --filter @gomate/frontend i18n:validate
      - name: Build
        run: pnpm --filter @gomate/frontend build
        env:
          PUBLIC_API_URL: https://api.gomate.live
      # Lint: non-blocking for now (historical debt)
      - name: Lint (non-blocking)
        run: pnpm --filter @gomate/frontend lint || echo "Lint warnings - to be fixed in dedicated task"
        continue-on-error: true
      - name: Test (non-blocking)
        run: pnpm --filter @gomate/frontend test || echo "Tests skipped"
        continue-on-error: true

  # Lighthouse Performance Audit
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Lighthouse on production
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://gomate.live/
            https://gomate.live/locations
            https://gomate.live/teams
          uploadArtifacts: true
          budgetPath: ./lighthouse-budget.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
