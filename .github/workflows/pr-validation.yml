name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # API Package Validation
  api-checks:
    name: API Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @gomate/api lint
      - name: Type Check
        run: pnpm --filter @gomate/api type-check
      - name: Build
        run: pnpm --filter @gomate/api build
      - name: Test
        run: pnpm --filter @gomate/api test

  # Frontend Package Validation
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Generate i18n locales
        run: pnpm i18n:build
      # Critical path: must pass for deployment
      - name: Type Check
        run: pnpm --filter @gomate/frontend type-check
      - name: i18n Key Validation
        run: pnpm --filter @gomate/frontend i18n:validate
      - name: Build
        run: pnpm --filter @gomate/frontend build
        env:
          PUBLIC_API_URL: https://api.gomate.live
      # Lint: non-blocking for now (historical debt)
      - name: Lint (non-blocking)
        run: pnpm --filter @gomate/frontend lint || echo "Lint warnings - to be fixed in dedicated task"
        continue-on-error: true
  # E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Generate i18n locales
        run: pnpm i18n:build
      - name: Run E2E tests
        run: pnpm e2e:ci
        env:
          CI: true
          PUBLIC_API_URL: http://localhost:8799
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-report/
          retention-days: 7
