name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api-and-database:
    name: API and database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: latest
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Removed-system gate
        run: |
          pnpm check:legacy-removal
          pnpm test:delivery
      - name: Migration and schema contract
        run: pnpm --filter @gomate/api check:migrations
      - name: Lint
        run: pnpm --filter @gomate/api lint
      - name: Type check
        run: pnpm --filter @gomate/api type-check
      - name: Build
        run: pnpm --filter @gomate/api build
      - name: Unit, integration, and real workerd D1 tests
        run: pnpm --filter @gomate/api test

  unified-worker:
    name: Frontend and unified Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: latest
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate locales
        run: pnpm i18n:build
      - name: Wrangler binding types are current
        run: pnpm --filter @gomate/frontend worker:types:check
      - name: i18n contract
        run: pnpm --filter @gomate/frontend i18n:validate
      - name: Lint
        run: pnpm --filter @gomate/frontend lint
      - name: Type check
        run: pnpm --filter @gomate/frontend type-check
      - name: Tests
        run: pnpm --filter @gomate/frontend test
      - name: Production build
        run: pnpm --filter @gomate/frontend build
      - name: Worker bundle dry run
        run: pnpm --filter @gomate/frontend worker:dry-run
      - name: Worker gzip size budget
        run: pnpm --filter @gomate/frontend worker:size
      - name: Worker startup check
        run: pnpm --filter @gomate/frontend worker:startup

  e2e:
    name: One-process E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: latest
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Create local Worker secrets
        run: printf '%s\n' 'BETTER_AUTH_SECRET=ci-local-dev-secret-key-32chars-long-12345' 'RESEND_API_KEY=' > frontend/.dev.vars
      - name: Generate locales and initialize V2 D1
        run: |
          pnpm i18n:build
          pnpm db:reset
      - name: Run browser tests against the unified Worker
        run: pnpm e2e:ci
        env:
          CI: "true"
          BETTER_AUTH_SECRET: ci-local-dev-secret-key-32chars-long-12345
          DEBUG: pw:webserver
      - name: Generate E2E health report
        if: always()
        run: node scripts/e2e-health-report.mjs
      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e-report/
            e2e-health-report.json
            e2e-health-history.json
          retention-days: 14

  lighthouse:
    name: Lighthouse unified Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: latest
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create local Worker secrets
        run: printf '%s\n' 'BETTER_AUTH_SECRET=ci-local-dev-secret-key-32chars-long-12345' 'RESEND_API_KEY=' > frontend/.dev.vars
      - name: Prepare locales and V2 D1
        run: |
          pnpm i18n:build
          pnpm db:reset
      - name: Build production Worker
        run: pnpm --filter @gomate/frontend build
      - name: Start production Worker preview
        run: |
          pnpm --filter @gomate/frontend preview -- --host 127.0.0.1 --port 5432 > /tmp/gomate-lighthouse-worker.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5432/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/gomate-lighthouse-worker.log
          exit 1
      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14
