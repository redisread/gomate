name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # API Package Validation
  api-checks:
    name: api-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @gomate/api lint
      - name: Migrations Sync Check
        run: pnpm --filter @gomate/api check:migrations
      - name: Type Check
        run: pnpm --filter @gomate/api type-check
      - name: Build
        run: pnpm --filter @gomate/api build
      - name: Test
        run: pnpm --filter @gomate/api test

  # Frontend Package Validation
  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Generate i18n locales
        run: pnpm i18n:build
      # Critical path: must pass for deployment
      - name: Type Check
        run: pnpm --filter @gomate/frontend type-check
      - name: i18n Key Validation
        run: pnpm --filter @gomate/frontend i18n:validate
      - name: Build
        run: pnpm --filter @gomate/frontend build
        env:
          PUBLIC_API_URL: https://api.gomate.live
      - name: Lint
        run: pnpm --filter @gomate/frontend lint
  # E2E Tests (local dev server)
  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Generate i18n locales
        run: pnpm i18n:build
      - name: Prepare local secrets for wrangler dev
        run: |
          # CI 中没有本地 .dev.vars，需要给 wrangler dev 提供一个测试用的 BETTER_AUTH_SECRET
          cat > api/.dev.vars <<'EOF'
          BETTER_AUTH_SECRET=ci-local-dev-secret-key-32chars-long-12345
          RESEND_API_KEY=
          AMAP_SERVER_KEY=
          EOF
          echo "api/.dev.vars created"
      - name: Verify required environment variables
        run: pnpm env:check --ci
        env:
          PUBLIC_API_URL: http://localhost:8799
      - name: Reset and verify local D1 database
        run: |
          pnpm db:reset
          dbfile=$(find "$HOME/.gomate/wrangler-state/v3/d1/miniflare-D1DatabaseObject" -maxdepth 1 -name '*.sqlite' ! -name 'metadata.sqlite' -print -quit)
          echo "D1 database file: $dbfile"
          sqlite3 "$dbfile" "SELECT COUNT(*) AS users_count FROM users;"
          sqlite3 "$dbfile" "SELECT email, role FROM users ORDER BY email LIMIT 10;"
          sqlite3 "$dbfile" "SELECT COUNT(*) AS accounts_count FROM accounts;"
          sqlite3 "$dbfile" "SELECT account_id, provider_id FROM accounts ORDER BY account_id LIMIT 10;"
      - name: Run E2E tests
        run: pnpm e2e:ci
        env:
          CI: true
          PUBLIC_API_URL: http://localhost:8799
          DEBUG: pw:webserver
      - name: Generate E2E health report
        if: always()
        run: node scripts/e2e-health-report.mjs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-report/
          retention-days: 7
      - name: Upload E2E health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-health-report
          path: |
            e2e-health-report.json
            e2e-health-history.json
          retention-days: 14
