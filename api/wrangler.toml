name = "gomate-api"
main = "src/index.ts"
compatibility_date = "2026-02-26"
compatibility_flags = ["nodejs_compat"]
account_id = "e3afbb613458022947cd9dc9f5bd6334"

# 本地开发：监听所有网络接口，iOS 模拟器可通过宿主机 IP 访问
[dev]
ip = "0.0.0.0"
port = 8799

# R2 bucket for application storage (images, avatars, etc.)
[[r2_buckets]]
binding = "R2"
bucket_name = "gomate"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "gomate-db"
database_id = "7d17d076-202f-48f8-b343-24209cdb0ba1"
migrations_dir = "db/migrations"

# KV namespace for session cache
[[kv_namespaces]]
binding = "GOMATE_KV"
id = "638ecd78e70c48fda01904bc9c2105d8"

[observability]
enabled = true
head_sampling_rate = 1

[placement]
mode = "smart"

# 定时任务：每天 UTC 12:10（北京时间晚上 8:10）更新过期队伍状态
[triggers]
crons = ["10 12 * * *"]

# 环境变量（本地开发）
[vars]
R2_PUBLIC_URL = "https://gomate.cos.jiahongw.com"
RESEND_FROM_EMAIL = "GoMate <noreply@gomate.live>"
APP_URL = "http://localhost:8799"
FRONTEND_URL = "http://localhost:5432"
CORS_ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:4321,http://localhost:5432,https://gomate.live,https://api.gomate.live"
BETTER_AUTH_URL = "http://localhost:8799"
# BETTER_AUTH_SECRET 通过 .dev.vars（本地开发）或 wrangler secret put（生产）设置，不在此处明文存储

# 预发布环境（staging）
[env.staging]
name = "gomate-api-staging"
compatibility_date = "2026-02-26"
compatibility_flags = ["nodejs_compat"]

[env.staging.vars]
R2_PUBLIC_URL = "https://gomate-staging.cos.jiahongw.com"
RESEND_FROM_EMAIL = "GoMate <noreply@gomate.live>"
APP_URL = "https://api-staging.gomate.live"
FRONTEND_URL = "https://staging.gomate.live"
CORS_ALLOWED_ORIGINS = "https://staging.gomate.live,https://api-staging.gomate.live"
BETTER_AUTH_URL = "https://api-staging.gomate.live"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "gomate-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "gomate-db-staging"
database_id = "4d3e4208-2fad-468b-a1c3-c1f627b07f14"
migrations_dir = "db/migrations"

[[env.staging.kv_namespaces]]
binding = "GOMATE_KV"
id = "5668184b0f7642f6895b716ca84d1c4a"

[[env.staging.routes]]
pattern = "api-staging.gomate.live"
custom_domain = true

[env.staging.placement]
mode = "smart"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.triggers]
crons = ["10 12 * * *"]

# 生产环境
[env.production]
name = "gomate-api"
compatibility_date = "2026-02-26"
compatibility_flags = ["nodejs_compat"]

[env.production.vars]
R2_PUBLIC_URL = "https://gomate.cos.jiahongw.com"
RESEND_FROM_EMAIL = "GoMate <noreply@gomate.live>"
APP_URL = "https://api.gomate.live"
FRONTEND_URL = "https://gomate.live"
CORS_ALLOWED_ORIGINS = "https://gomate.live,https://api.gomate.live"
# Auth secret 通过 Cloudflare Secrets 管理，当前生产使用 AUTH_SECRET_V2
BETTER_AUTH_URL = "https://api.gomate.live"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "gomate"

[[env.production.d1_databases]]
binding = "DB"
database_name = "gomate-db"
database_id = "7d17d076-202f-48f8-b343-24209cdb0ba1"
migrations_dir = "db/migrations"

[[env.production.kv_namespaces]]
binding = "GOMATE_KV"
id = "638ecd78e70c48fda01904bc9c2105d8"

[env.production.placement]
mode = "smart"

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

[env.production.triggers]
crons = ["10 12 * * *"]
