name = "gomate-api"
main = "src/index.ts"
compatibility_date = "2026-02-26"
compatibility_flags = ["nodejs_compat"]
account_id = "e3afbb613458022947cd9dc9f5bd6334"

# 本地开发：监听所有网络接口，iOS 模拟器可通过宿主机 IP 访问
[dev]
ip = "0.0.0.0"
port = 8799

# R2 bucket for application storage (images, avatars, etc.)
[[r2_buckets]]
binding = "R2"
bucket_name = "gomate"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "gomate-db"
database_id = "7d17d076-202f-48f8-b343-24209cdb0ba1"
migrations_dir = "db/migrations"

# KV namespace for session cache
[[kv_namespaces]]
binding = "GOMATE_KV"
id = "638ecd78e70c48fda01904bc9c2105d8"

[observability]
enabled = true
head_sampling_rate = 1

[placement]
mode = "smart"

# WASM 模块绑定 - resvg-wasm
[[wasm_modules]]
binding = "RESVG_WASM"
module = "./node_modules/@resvg/resvg-wasm/index_bg.wasm"

# 定时任务：每天 UTC 12:10（北京时间晚上 8:10）更新过期队伍状态
[triggers]
crons = ["10 12 * * *"]

# 环境变量（本地开发）
[vars]
R2_PUBLIC_URL = "https://gomate.cos.jiahongw.com"
RESEND_FROM_EMAIL = "GoMate <noreply@gomate.live>"
APP_URL = "http://localhost:8799"
FRONTEND_URL = "http://localhost:5432"
CORS_ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:4321,http://localhost:5432,https://gomate.live,https://api.gomate.live"
AMAP_SERVER_KEY = ""
BETTER_AUTH_SECRET = "local-dev-secret-key-32chars-long-12345"
BETTER_AUTH_URL = "http://localhost:8799"
# BETTER_AUTH_SECRET 也可以通过 wrangler secret put 设置，不在此处明文存储

# 生产环境
[env.production]
name = "gomate-api"
compatibility_date = "2026-02-26"
compatibility_flags = ["nodejs_compat"]

[env.production.vars]
R2_PUBLIC_URL = "https://gomate.cos.jiahongw.com"
RESEND_FROM_EMAIL = "GoMate <noreply@gomate.live>"
APP_URL = "https://api.gomate.live"
FRONTEND_URL = "https://gomate.live"
CORS_ALLOWED_ORIGINS = "https://gomate.live,https://api.gomate.live"
AMAP_SERVER_KEY = ""
BETTER_AUTH_SECRET = "s6Vdedr89YJzXbjEEtN3jnTvnx3HfbBZ"
BETTER_AUTH_URL = "https://api.gomate.live"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "gomate"

[[env.production.d1_databases]]
binding = "DB"
database_name = "gomate-db"
database_id = "7d17d076-202f-48f8-b343-24209cdb0ba1"
migrations_dir = "db/migrations"

[[env.production.kv_namespaces]]
binding = "GOMATE_KV"
id = "638ecd78e70c48fda01904bc9c2105d8"

[env.production.placement]
mode = "smart"

# WASM 模块绑定 - resvg-wasm (生产环境)
[[env.production.wasm_modules]]
binding = "RESVG_WASM"
module = "./node_modules/@resvg/resvg-wasm/index_bg.wasm"

[env.production.observability]
enabled = true
head_sampling_rate = 0.1

# 定时任务：每天 UTC 12:10（北京时间晚上 8:10）更新过期队伍状态
[env.production.triggers]
crons = ["10 12 * * *"]
